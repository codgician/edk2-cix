name: "Watch upstreams"
"on":
  schedule:
  - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        default: false
        description: "Report the current ranges even if already seen"
        required: true
        type: "boolean"
permissions: {}
concurrency:
  # One writer of the state branch at a time; queued runs see its result.
  cancel-in-progress: false
  group: "upstream-watch"
env:
  STATE_BRANCH: "upstream-state"
jobs:
  check:
    name: "Check upstreams"
    if: "github.repository == 'codgician/edk2-cix'"
    runs-on: "ubuntu-latest"
    timeout-minutes: 60
    permissions:
      contents: "read"
    outputs:
      changed: "${{ steps.check.outputs.changed }}"
      parent: "${{ steps.state.outputs.parent }}"
      ranges: "${{ steps.check.outputs.ranges }}"
      triage: "${{ steps.check.outputs.triage }}"
    steps:
    - name: "Checkout"
      uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7
      with:
        persist-credentials: false
        ref: "sky1"
    - name: "Restore upstream caches"
      uses: "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6
      with:
        key: "upstream-git-${{ github.run_id }}"
        path: "${{ runner.temp }}/upstream-cache"
        restore-keys: |
          upstream-git-
    - name: "Read last-seen state"
      id: "state"
      env:
        GH_TOKEN: "${{ github.token }}"
        REPOSITORY: "${{ github.repository }}"
      run: |
        mkdir -p "$RUNNER_TEMP/upstream"
        if parent=$(gh api "repos/$REPOSITORY/git/ref/heads/$STATE_BRANCH" --jq .object.sha 2>/dev/null); then
          gh api -H "Accept: application/vnd.github.raw" "repos/$REPOSITORY/contents/state.json?ref=$parent" \
            > "$RUNNER_TEMP/upstream/last-state.json"
        else
          parent=""
          : > "$RUNNER_TEMP/upstream/last-state.json"
        fi
        echo "parent=$parent" >> "$GITHUB_OUTPUT"
    - name: "Check"
      id: "check"
      env:
        FORCE: "${{ inputs.force && '--force' || '' }}"
        GH_TOKEN: "${{ github.token }}"
      run: |
        # shellcheck disable=SC2086
        python3 .github/scripts/upstream_watch.py check $FORCE \
          --wrapper . --wrapper-ref HEAD \
          --state "$RUNNER_TEMP/upstream/last-state.json" \
          --cache "$RUNNER_TEMP/upstream-cache" \
          --out "$RUNNER_TEMP/upstream/out"
    - name: "Upload report"
      uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
      with:
        if-no-files-found: "error"
        name: "upstream-report"
        path: "${{ runner.temp }}/upstream/out"
        retention-days: 30
  publish:
    name: "Publish issues and state"
    needs: "check"
    if: "needs.check.outputs.changed == 'true' || needs.check.outputs.ranges == 'true'"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    permissions:
      # Commit state.json to the state branch through the API.
      contents: "write"
      # Open or update one issue per upstream range.
      issues: "write"
    steps:
    - name: "Checkout"
      uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7
      with:
        persist-credentials: false
        ref: "sky1"
    - name: "Download report"
      uses: "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
      with:
        name: "upstream-report"
        path: "${{ runner.temp }}/out"
    - name: "Open or update issues"
      env:
        GH_TOKEN: "${{ github.token }}"
        REPOSITORY: "${{ github.repository }}"
      run: |
        python3 .github/scripts/upstream_watch.py publish --out "$RUNNER_TEMP/out" --repo "$REPOSITORY"
    - name: "Commit state"
      if: "needs.check.outputs.changed == 'true'"
      env:
        GH_TOKEN: "${{ github.token }}"
        PARENT: "${{ needs.check.outputs.parent }}"
        REPOSITORY: "${{ github.repository }}"
      run: |
        python3 .github/scripts/upstream_watch.py commit-state --out "$RUNNER_TEMP/out" \
          --repo "$REPOSITORY" --branch "$STATE_BRANCH" --parent "$PARENT"
    - name: "Upload issue numbers"
      uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
      with:
        if-no-files-found: "error"
        name: "upstream-issues"
        path: "${{ runner.temp }}/out/issues.json"
        retention-days: 30
  triage:
    name: "Triage"
    needs:
    - "check"
    - "publish"
    if: "needs.check.outputs.triage == 'true' && vars.UPSTREAM_TRIAGE == 'true'"
    permissions:
      contents: "read"
      # The triage comment job posts to the range issues.
      issues: "write"
    uses: "./.github/workflows/upstream-triage.yaml" # zizmor: ignore[self-repository] pinned actionlint 1.7.12 does not support GitHub's $/ syntax
    secrets:
      DENDRO_API_KEY: "${{ secrets.DENDRO_API_KEY }}"
